<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tim Unverzagt</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="page">

    <section class="hero">

        <img
            class="hero-background"
            src="Images/HomePage/home_page_background.svg"
            alt=""
        >

        <img
            class="hero-banner"
            src="Images/HomePage/home_page_banner.svg"
            alt=""
        >

        <img
            class="hero-cards"
            src="Images/HomePage/home_page_cards.svg"
            alt=""
        >

        <div class="hero-content">

            <h1>Tim Unverzagt</h1>

            <div class="level-design">
                <img
                    class="star-and"
                    src="Images/HomePage/home_page_star_and.svg"
                    alt=""
                >

                <span>Level Design</span>
            </div>

            <h2>Balancing</h2>

            <img
                class="star-red"
                src="Images/HomePage/home_page_star_red.svg"
                alt=""
            >

            <img
                class="star-gray"
                src="Images/HomePage/home_page_star_gray.svg"
                alt=""
            >

        </div>

    </section>


    <section class="recent-work">

        <div class="garland-layer">

            <img
                class="hero-garlands"
                src="Images/HomePage/home_page_garlands.svg"
                alt=""
            >

        </div>

        <h2>Recent Work</h2>

        <div class="work-grid">

            <div class="work-card">

                <img
                    src="Images/HomePage/home_page_frame.svg"
                    alt=""
                >

                <div class="work-card-content">
                    <h3>Project One</h3>
                    <p>Description</p>
                </div>

            </div>


            <div class="work-card">

                <img
                    src="Images/HomePage/home_page_frame.svg"
                    alt=""
                >

                <div class="work-card-content">
                    <h3>Project Two</h3>
                    <p>Description</p>
                </div>

            </div>


            <div class="work-card">

                <img
                    src="Images/HomePage/home_page_frame.svg"
                    alt=""
                >

                <div class="work-card-content">
                    <h3>Project Three</h3>
                    <p>Description</p>
                </div>

            </div>

        </div>

    </section>


    <footer>

        <div class="bottom-decoration">

            <img
                class="hero-line"
                src="Images/HomePage/home_page_line.svg"
                alt=""
            >

            <img
                class="hero-bottom-banner"
                src="Images/HomePage/home_page_banner.svg"
                alt=""
            >

        </div>

    </footer>

</div>

</body>
</html>
